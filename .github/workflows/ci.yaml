name: CI

# Pull-request gate. Nothing runs on a plain push.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the API
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/secret-scan.yaml@304e49bb34f2d551ac21f5b26bea067f57da4c5a # v2.0.0

  workflows:
    permissions:
      contents: read
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/workflow-lint.yaml@304e49bb34f2d551ac21f5b26bea067f57da4c5a # v2.0.0
